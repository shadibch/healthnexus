name: healthnexus

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthnexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthnexus}
      POSTGRES_DB: ${POSTGRES_DB:-healthnexus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── One-shot: apply committed drizzle migrations (drizzle-kit migrate) ───────
  db-migrate:
    build:
      context: .
      dockerfile: docker/db-migrate.Dockerfile
    restart: "no"
    entrypoint: ["sh", "-c", "pnpm --filter @workspace/db db:migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-healthnexus}:${POSTGRES_PASSWORD:-healthnexus}@db:5432/${POSTGRES_DB:-healthnexus}
    depends_on:
      db:
        condition: service_healthy

  # ── API server (seeds HAAD activities, medications, pharmacies… on boot) ─────
  api:
    build:
      context: .
      dockerfile: docker/api-server.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-healthnexus}:${POSTGRES_PASSWORD:-healthnexus}@db:5432/${POSTGRES_DB:-healthnexus}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FEEDBACK_EMAIL: ${FEEDBACK_EMAIL:-support@camsclinic.org}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
