# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys: managed PostgreSQL + the HealthNexus web service (API + compiled client).
#
# Usage:
#   1. Push this repository to GitHub/GitLab.
#   2. In the Render dashboard: New + → Blueprint → pick this repo → Apply.
#      (or "New + → PostgreSQL" / "New + → Web Service" manually, see README steps)

databases:
  - name: healthnexus-db
    databaseName: healthnexus
    user: healthnexus
    # NOTE: the `free` plan expires after 30 days — use a paid plan for anything real.
    plan: free
    region: frankfurt   # pick the region closest to your users

services:
  - type: web
    name: healthnexus-api
    runtime: docker
    dockerfilePath: ./docker/api-server.Dockerfile
    dockerContext: .
    # Start sequence lives in docker/start-api.sh (image CMD): schema push, then server.
    healthCheckPath: /api/healthz
    plan: free          # free tier sleeps after 15 min idle; use starter+ for always-on
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthnexus-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Public URL used in verification / password-reset email links.
      # Replace with the final production URL (e.g. https://healthnexus.onrender.com)
      - key: APP_BASE_URL
        sync: false
      # EMAIL PROVIDER — Render free tier BLOCKS outbound SMTP on ports 25/465/587,
      # so use an HTTP (HTTPS/443) API on free tier instead. Preferred: Hostinger
      # Mail API (you already have the mailbox). Fallbacks: Resend API, then SMTP.
      # Hostinger Mail API (HTTPS/443) — set in the dashboard:
      #   HOSTINGER_MAIL_API_TOKEN = token from hPanel → email domain → Agentic Mail → API access
      #   HOSTINGER_MAILBOX_ID     = resource ID of the sending mailbox (e.g. info@camsclinic.org)
      - key: HOSTINGER_MAIL_API_TOKEN
        sync: false
      - key: HOSTINGER_MAILBOX_ID
        sync: false
      # Resend HTTP API (HTTPS/443) — optional alternative, set key in dashboard
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: HealthNexus <no-reply@camsclinic.org>
      # SMTP for verification + password-reset emails — set these in the dashboard
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: HealthNexus <info@camsclinic.org>
      # Where customer feedback submissions are emailed
      - key: FEEDBACK_EMAIL
        value: support@camsclinic.org
      # Optional — only needed for the AI assistant feature
      - key: OPENAI_API_KEY
        sync: false
