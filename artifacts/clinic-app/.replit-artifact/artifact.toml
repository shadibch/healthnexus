kind = "web"
previewPath = "/"
title = "ClinicFlow — Hospital & Clinic Management"
version = "1.0.0"
id = "artifacts/clinic-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20282

[services.development]
run = "pnpm --filter @workspace/clinic-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clinic-app", "run", "build" ]
publicDir = "artifacts/clinic-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20282"
BASE_PATH = "/"
