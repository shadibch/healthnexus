name: Deploy HealthNexus to Azure

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  ACR_NAME: hnxregistry
  RESOURCE_GROUP: healthcams-uaenorth
  CONTAINER_APP_NAME: hnx-app
  IMAGE_NAME: healthnexus

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -f docker/api-server.Dockerfile \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG} .
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}

      - name: Deploy to Container App
        run: |
          az containerapp update \
            -g ${{ env.RESOURCE_GROUP }} \
            -n ${{ env.CONTAINER_APP_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}